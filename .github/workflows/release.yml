# Publishes to PyPI when you publish a GitHub release (tag v0.1.0 and so on).
# Uses PyPI trusted publishing: no API token is stored anywhere.
# One-time setup on pypi.org: Account settings > Publishing > Add a pending publisher with
#   PyPI project name: agent-scorecard, Owner: sagacioussid02, Repository: agent-scorecard,
#   Workflow name: release.yml, Environment name: pypi
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build pytest
      - run: python -m pytest
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
